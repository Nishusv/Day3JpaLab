#spring.profiles.active=postgres
spring.application.name=day3-jpa-lab
server.port=8080

# ---- DEFAULT: in-memory H2 (no setup, data resets on restart) ----
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browser DB viewer (H2 only): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Hibernate ----
# update = create/alter tables to match the entities (good for learning; never use blindly in production)
spring.jpa.hibernate.ddl-auto=update
# Print every SQL statement Hibernate runs - the key to understanding JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Uncomment to also see the bound parameter values
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Lazy fields can only be read inside a transaction (we map to DTOs in the service layer)
spring.jpa.open-in-view=false

# To use PostgreSQL or MySQL run with profile "postgres" or "mysql"
